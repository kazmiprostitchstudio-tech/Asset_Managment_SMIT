<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaintainIQ - Secure Gateway</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    style="
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f1f5f9;
    "
  >
    <div
      class="data-sector"
      style="max-width: 400px; text-align: center; width: 100%"
    >
      <div
        style="
          background: #1e3a8a;
          padding: 15px;
          border-radius: 6px;
          margin-bottom: 20px;
        "
      >
        <h1 style="color: white; font-size: 1.5rem; letter-spacing: 1px"
          >MAINTAIN-IQ</h1
        >
      </div>

      <h2 class="sector-title" style="font-size: 1.1rem; margin-bottom: 25px"
        >Admin Authentication Protocol</h2
      >

      <input
        type="text"
        id="auth-user"
        class="input-terminal"
        placeholder="System ID (Type anything...)"
        value="admin_smit"
      />
      <input
        type="password"
        id="auth-pass"
        class="input-terminal"
        placeholder="Passcode"
        value="123456"
      />

      <button
        onclick="window.location.href='dashboard.html'"
        class="compiler-trigger"
        style="margin-top: 10px"
        >Initialize Secure Session</button
      >

      <p style="font-size: 0.8rem; color: #64748b; margin-top: 15px"
        >Authorized Personnel Only</p
      >
    </div>
  </body>
</html>

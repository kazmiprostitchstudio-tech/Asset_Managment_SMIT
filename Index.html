<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaintainIQ | Secure Gateway</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Login Specific Enhancements */
      .login-container {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .boot-text {
        font-family: monospace;
        font-size: 0.8rem;
        margin-top: 10px;
        color: #64748b;
      }
      .loading-spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #16a34a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 10px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body
    style="
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f1f5f9;
    "
  >
    <div class="login-container">
      <div
        style="
          background: #1e3a8a;
          padding: 20px;
          border-radius: 10px;
          margin-bottom: 25px;
        "
      >
        <h1 style="color: white; font-size: 1.5rem; letter-spacing: 2px"
          >MAINTAIN-IQ</h1
        >
      </div>

      <input
        type="text"
        id="auth-user"
        class="input-terminal"
        placeholder="System ID"
        value="admin_smit"
      />
      <input
        type="password"
        id="auth-pass"
        class="input-terminal"
        placeholder="Passcode"
        value="123456"
      />

      <button
        id="login-btn"
        class="compiler-trigger"
        onclick="runBootSequence()"
        >INITIALIZE ACCESS</button
      >

      <div id="loader" class="loading-spinner"></div>
      <div id="status-msg" class="boot-text">System Standby</div>
    </div>

    <script>
      function runBootSequence() {
        const user = document.getElementById('auth-user').value;
        const pass = document.getElementById('auth-pass').value;
        const btn = document.getElementById('login-btn');
        const msg = document.getElementById('status-msg');
        const loader = document.getElementById('loader');

        if (user === '' || pass === '') {
          alert('Error: Credentials required.');
          return;
        }

        // Professional Boot Simulation
        btn.disabled = true;
        loader.style.display = 'block';
        msg.innerText = 'Initiating handshake with server...';
        btn.innerText = 'AUTHENTICATING...';

        setTimeout(() => {
          msg.innerText = 'Encryption verified. Access granted.';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        }, 2000);
      }
    </script>
  </body>
</html>

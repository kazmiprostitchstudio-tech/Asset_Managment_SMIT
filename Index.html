<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaintainIQ - Secure Gateway</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Extra professional polish for the login page */
      .login-input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
      }
      .login-btn-pro {
        width: 100%;
        padding: 14px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }
      .login-btn-pro:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body
    style="
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f1f5f9;
    "
  >
    <div
      class="data-sector"
      style="max-width: 400px; text-align: center; width: 100%"
    >
      <div
        style="
          background: #1e3a8a;
          padding: 20px;
          border-radius: 10px;
          margin-bottom: 25px;
        "
      >
        <h1 style="color: white; font-size: 1.6rem; letter-spacing: 2px"
          >MAINTAIN-IQ</h1
        >
      </div>

      <h2 class="sector-title" style="font-size: 1.1rem; margin-bottom: 25px"
        >Admin Authentication Protocol</h2
      >

      <input
        type="text"
        id="auth-user"
        class="login-input"
        placeholder="System ID"
        value="admin_smit"
      />
      <input
        type="password"
        id="auth-pass"
        class="login-input"
        placeholder="Passcode"
        value="123456"
      />

      <button id="login-btn" class="login-btn-pro" onclick="handleLogin()"
        >INITIALIZE SECURE SESSION</button
      >

      <div
        id="status-msg"
        style="
          margin-top: 15px;
          color: #1e3a8a;
          font-weight: bold;
          font-size: 0.9rem;
        "
      ></div>

      <p style="font-size: 0.8rem; color: #64748b; margin-top: 20px"
        >Authorized Personnel Only</p
      >
    </div>

    <script>
      function handleLogin() {
        const btn = document.getElementById('login-btn');
        const msg = document.getElementById('status-msg');

        btn.innerText = 'VERIFYING ENCRYPTION...';
        btn.style.background = '#16a34a'; // Green color
        msg.innerText = 'Connecting to Mainframe...';

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      }
    </script>
  </body>
</html>
